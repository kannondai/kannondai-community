<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PWA Debug - 観音台コミュニティ</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #2c3e50;
      color: white;
    }
    .info {
      background: #34495e;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }
    button {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      margin: 5px;
    }
  </style>
</head>
<body>
  <h1>🔧 PWA デバッグページ</h1>
  
  <div class="info">
    <h2>画面情報</h2>
    <p id="screen-width"></p>
    <p id="user-agent"></p>
  </div>
  
  <div class="info">
    <h2>PWA状態</h2>
    <p id="pwa-status"></p>
    <p id="sw-status"></p>
  </div>
  
  <div class="info">
    <h2>📊 PWA条件チェック</h2>
    <div id="pwa-check" style="font-family: monospace; font-size: 14px;"></div>
  </div>
  
  <div class="info">
    <h2>イベントログ</h2>
    <div id="event-log" style="font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto;"></div>
  </div>
  
  <div class="info">
    <h2>🧪 PWAインストールテスト</h2>
    <button id="install-test-button" style="background: #e74c3c; font-size: 18px; padding: 15px 30px;">
      📱 今すぐインストールを試す
    </button>
    <p id="install-result" style="margin-top: 10px; font-weight: bold;"></p>
  </div>
  
  <button onclick="location.href='top.html'">メインページへ</button>
  
  <!-- Eruda デバッグツール -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
    
    const log = document.getElementById('event-log');
    function addLog(msg) {
      const time = new Date().toLocaleTimeString('ja-JP');
      log.innerHTML += `[${time}] ${msg}<br>`;
      log.scrollTop = log.scrollHeight;
    }
    
    // 画面情報
    document.getElementById('screen-width').textContent = `画面幅: ${window.innerWidth}px`;
    document.getElementById('user-agent').textContent = `UA: ${navigator.userAgent.substring(0, 50)}...`;
    
    // PWA状態チェック
    const isStandalone = navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    document.getElementById('pwa-status').textContent = `PWAモード: ${isStandalone ? 'インストール済み' : '未インストール'}`;
    
    // Service Worker状態
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration('/kannondai-community/')
        .then(reg => {
          if (reg) {
            document.getElementById('sw-status').textContent = `Service Worker: 登録済み (${reg.scope})`;
            addLog('✅ Service Worker登録済み');
          } else {
            document.getElementById('sw-status').textContent = 'Service Worker: 未登録';
            addLog('❌ Service Worker未登録');
          }
        });
    } else {
      document.getElementById('sw-status').textContent = 'Service Worker: 非対応ブラウザ';
      addLog('❌ Service Worker非対応');
    }
    
    // PWA条件の自動チェック
    const checkDiv = document.getElementById('pwa-check');
    checkDiv.innerHTML = '⏳ チェック中...';
    
    Promise.all([
      // HTTPS チェック
      Promise.resolve(location.protocol === 'https:'),
      // manifest.json チェック
      fetch('/kannondai-community/manifest.json').then(r => r.ok).catch(() => false),
      // icon-192.png チェック
      fetch('/kannondai-community/icons/icon-192.png').then(r => r.ok).catch(() => false),
      // icon-512.png チェック
      fetch('/kannondai-community/icons/icon-512.png').then(r => r.ok).catch(() => false),
      // Service Worker active チェック
      navigator.serviceWorker.getRegistration().then(r => r?.active ? true : false).catch(() => false),
      // Chrome version チェック
      Promise.resolve(parseInt(navigator.userAgent.match(/Chrome\/(\d+)/)?.[1] || '0'))
    ]).then(([https, manifest, icon192, icon512, swActive, chromeVer]) => {
      const results = [
        { name: 'HTTPS', ok: https, value: location.protocol },
        { name: 'manifest.json', ok: manifest, value: manifest ? '読み込み成功' : '読み込み失敗' },
        { name: 'icon-192.png', ok: icon192, value: icon192 ? '存在' : '404 Not Found' },
        { name: 'icon-512.png', ok: icon512, value: icon512 ? '存在' : '404 Not Found' },
        { name: 'Service Worker', ok: swActive, value: swActive ? 'Active' : '未アクティブ' },
        { name: 'Chrome Version', ok: chromeVer >= 100, value: chromeVer }
      ];
      
      let html = '';
      let allOk = true;
      
      results.forEach(r => {
        const icon = r.ok ? '✅' : '❌';
        html += `${icon} ${r.name}: ${r.value}<br>`;
        if (!r.ok) allOk = false;
        
        // ログにも記録
        addLog(`${icon} ${r.name}: ${r.value}`);
      });
      
      html += '<br>';
      if (allOk) {
        html += '<strong style="color: #27ae60;">✅ 全条件クリア！</strong><br>';
        html += 'beforeinstallpromptが発火しない場合は、Chrome側の追加条件（ユーザーエンゲージメント）が原因です。';
      } else {
        html += '<strong style="color: #e74c3c;">❌ 一部の条件が未達です</strong><br>';
        html += '上記の❌項目を修正する必要があります。';
      }
      
      checkDiv.innerHTML = html;
    });
    
    // beforeinstallprompt イベント監視
    let deferredPrompt;
    addLog('⏳ beforeinstallpromptイベントを待機中...');
    
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      addLog('✅ beforeinstallpromptイベント発火！');
      addLog(`→ PWAインストール可能です（画面幅: ${window.innerWidth}px）`);
      
      // ボタンを有効化
      const installButton = document.getElementById('install-test-button');
      if (installButton) {
        installButton.style.background = '#27ae60';
        installButton.textContent = '✅ インストール準備完了！タップしてください';
      }
    });
    
    // 5秒後にイベント未発火の場合
    setTimeout(() => {
      if (!deferredPrompt) {
        addLog('⚠️ beforeinstallpromptが5秒以内に発火しませんでした');
        addLog('可能な原因:');
        addLog('  1. 既にPWAインストール済み');
        addLog('  2. PWA条件未達（HTTPS、manifest、Service Worker）');
        addLog('  3. ブラウザが非対応（iOS Safariなど）');
        addLog(`  4. 画面幅が広すぎる（現在: ${window.innerWidth}px）`);
        
        // ボタンのメッセージを更新
        const installButton = document.getElementById('install-test-button');
        if (installButton) {
          installButton.textContent = '⚠️ タップして診断結果を表示';
        }
      }
    }, 5000);
    
    // appinstalled イベント
    window.addEventListener('appinstalled', () => {
      addLog('🎉 PWAがインストールされました');
    });
    
    // インストールテストボタン
    const installButton = document.getElementById('install-test-button');
    const installResult = document.getElementById('install-result');
    
    installButton.addEventListener('click', async () => {
      installResult.textContent = '';
      
      if (!deferredPrompt) {
        // beforeinstallprompt未発火の場合
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        
        if (isIOS) {
          installResult.innerHTML = '❌ iOS Safari検出<br>手動でインストールしてください：<br>共有ボタン（□↑）→「ホーム画面に追加」';
          installResult.style.color = '#f39c12';
          addLog('iOS Safari: 手動インストール案内を表示');
        } else {
          installResult.innerHTML = '❌ インストールプロンプト未発火<br><br>原因の可能性：<br>1. PWA条件未達（manifest/SW/HTTPS）<br>2. Chrome設定でブロック<br>3. 既にインストール済み（ホーム画面確認）';
          installResult.style.color = '#e74c3c';
          addLog('エラー: beforeinstallpromptイベント未発火');
          
          // 追加診断
          addLog('=== 追加診断 ===');
          addLog(`Chrome version: ${navigator.userAgent.match(/Chrome\/(\d+)/)?.[1] || '不明'}`);
          addLog(`HTTPS: ${location.protocol === 'https:'}`);
          addLog(`SW ready: ${navigator.serviceWorker.controller ? 'あり' : 'なし'}`);
        }
        return;
      }
      
      try {
        addLog('🚀 インストールプロンプトを表示します...');
        installResult.textContent = '📱 インストール中...';
        installResult.style.color = '#3498db';
        
        // プロンプト表示
        deferredPrompt.prompt();
        
        // ユーザーの選択を待つ
        const { outcome } = await deferredPrompt.userChoice;
        
        if (outcome === 'accepted') {
          installResult.textContent = '✅ インストール成功！ホーム画面を確認してください';
          installResult.style.color = '#27ae60';
          addLog('✅ ユーザーがインストールを承認');
        } else {
          installResult.textContent = '❌ インストールがキャンセルされました';
          installResult.style.color = '#e67e22';
          addLog('❌ ユーザーがインストールを拒否');
        }
        
        // プロンプトクリア
        deferredPrompt = null;
        
      } catch (error) {
        installResult.textContent = `❌ エラー: ${error.message}`;
        installResult.style.color = '#e74c3c';
        addLog(`❌ インストールエラー: ${error.message}`);
      }
    });
    
    addLog(`初期化完了 (画面幅: ${window.innerWidth}px)`);
  </script>
</body>
</html>
